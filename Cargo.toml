[package]
name = "ic10-tools"
version = "0.1.0"
edition = "2024"
description = "Lint, simulate and check the Stationeers IC10 scripts in this repo"
publish = false

[[bin]]
name = "ic10"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
glob = "0.3"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "deny"
question_mark_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"
